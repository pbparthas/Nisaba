name: Deploy Nisaba to GitHub Pages

on:
  push:
    branches: [claude/cross-platform-sync-app-wsoso4]
    paths: ['nisaba/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: nisaba/app
        run: npm ci
      - name: Test
        working-directory: nisaba/app
        run: npm test
      - name: Build
        working-directory: nisaba/app
        # Served at the root of the custom domain (nisaba.orionforge.dev), so
        # the base is '/'. (Was /Nisaba/ for the project-page URL.)
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: nisaba/app/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
